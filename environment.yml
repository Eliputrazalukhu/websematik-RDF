# Snowflake Environment Configuration
# This file can be used for conda environments or as reference for package versions

name: rdf_owl_visualizer
channels:
  - conda-forge
  - defaults

dependencies:
  - python>=3.8
  - pip
  - pip:
    # Core dependencies
    - streamlit>=1.28.0
    - rdflib>=6.3.2
    - networkx>=3.1
    - plotly>=5.17.0
    - pandas>=2.0.0
    # Snowflake dependencies
    - snowflake-connector-python>=3.2.0
    - snowflake-snowpark-python>=1.9.0
    # Data export
    - openpyxl>=3.1.2
    # Optional: uncomment for network graph visualization
    # - streamlit-agraph>=0.0.45

